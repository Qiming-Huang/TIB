[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tib-attribution"
version = "0.1.0"
description = "Standalone sample-wise tempered information bottleneck for image-text attribution"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "transformers>=4.40,<6", "numpy>=1.24", "Pillow>=9"]

[tool.setuptools.packages.find]
include = ["tib_attribution*"]
